name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain info
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          for rt in sorted(d, reverse=True):
              if 'iOS' not in rt: continue
              for dev in d[rt]:
                  if dev['name'].startswith('iPhone') and dev['isAvailable']:
                      print(dev['udid']); sys.exit(0)
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Simulator: $UDID"

      - name: Build and test (simulator)
        run: |
          set -o pipefail
          xcodebuild test \
            -project GeoAlarm.xcodeproj -scheme GeoAlarm \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/test.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build-sim.log

      - name: Collect test diagnostics
        if: always()
        run: |
          mkdir -p /tmp/ci/crash
          cp ~/Library/Logs/DiagnosticReports/*GeoAlarm* /tmp/ci/crash/ 2>/dev/null || true
          if [ -d build/test.xcresult ]; then
            xcrun xcresulttool get test-results summary --path build/test.xcresult --compact > /tmp/ci/test-summary.json 2>/tmp/ci/test-summary.err || true
            xcrun xcresulttool get test-results tests --path build/test.xcresult --compact > /tmp/ci/test-details.json 2>/dev/null || true
          fi

      - name: Archive for device (unsigned)
        run: |
          set -o pipefail
          xcodebuild archive \
            -project GeoAlarm.xcodeproj -scheme GeoAlarm \
            -destination "generic/platform=iOS" \
            -archivePath build/GeoAlarm.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee build-device.log

      - name: Package .ipa
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/GeoAlarm.xcarchive/Products/Applications/GeoAlarm.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../GeoAlarm.ipa Payload)
          ls -lh build/GeoAlarm.ipa

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: GeoAlarm-ipa
          path: build/GeoAlarm.ipa

      - name: Publish release "latest"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest build/GeoAlarm.ipa \
            --title "GeoAlarm (build ${{ github.run_number }})" \
            --notes "Build ${{ github.run_number }} do commit ${{ github.sha }}. IPA sem assinatura, para sideload (veja o README)." \
            --prerelease

      - name: Publish logs to ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/ci
          for f in build-sim.log build-device.log; do
            [ -f "$f" ] || continue
            tail -n 4000 "$f" > "/tmp/ci/$f"
            grep -E "error:|warning: |Test Case.*(failed|passed)|Executed [0-9]+ tests|\*\* (BUILD|TEST|ARCHIVE)" "$f" > "/tmp/ci/${f%.log}.summary.txt" || true
          done
          echo "run=${{ github.run_number }} sha=${{ github.sha }} status=${{ job.status }}" > /tmp/ci/meta.txt
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan ci-logs-tmp
          git rm -rf . -q || true
          git clean -fdxq
          cp -R /tmp/ci/. .
          rm -rf crash/*.ips.tmp
          git add -A
          git commit -qm "CI logs for ${{ github.sha }}"
          git push -f origin HEAD:ci-logs

  ui-shots:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          for rt in sorted(d, reverse=True):
              if 'iOS' not in rt: continue
              for dev in d[rt]:
                  if dev['name'].startswith('iPhone') and dev['isAvailable']:
                      print(dev['udid']); sys.exit(0)
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: UI tour with screenshots
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p "$HOME/ui-shots"
          xcodebuild test \
            -project GeoAlarm.xcodeproj -scheme GeoAlarmUI \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/ui.xcresult \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee ui-test.log

      - name: Publish screenshots to ci-shots branch
        if: always()
        run: |
          mkdir -p /tmp/shots
          cp "$HOME"/ui-shots/*.png /tmp/shots/ 2>/dev/null || true
          grep -vE "CoreData" ui-test.log | grep -E "error:|failed|passed|Executed|TEST" | tail -60 > /tmp/shots/ui-summary.txt || true
          ls -la /tmp/shots
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout --orphan ci-shots-tmp
          git rm -rf . -q || true
          git clean -fdxq
          cp -R /tmp/shots/. .
          git add -A
          git commit -qm "UI screenshots for ${{ github.sha }}"
          git push -f origin HEAD:ci-shots
